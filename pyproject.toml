[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-analysis"
version = "0.1.0"
description = "V1 backend prototype: eval-driven genome/Whoop/lab -> report pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pandas>=2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dna-analysis = "dna_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dna_analysis.grader" = ["fixtures/*.json", "fixtures/*.yaml", "fixtures/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
